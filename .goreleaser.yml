version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ali5ter/unspool/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: unspool
    directory: Formula
    repository:
      owner: ali5ter
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/ali5ter/unspool
    description: A subscription-first, Shorts-free YouTube TUI
    license: MIT
    # mpv/yt-dlp drive playback, chafa renders preview-pane thumbnails —
    # all three are shelled out to (internal/playback, internal/thumbnail)
    # rather than vendored, so Homebrew must pull them in itself; without
    # this a fresh `brew install` left users hitting missing-dependency
    # warnings at first launch (issue #8).
    dependencies:
      - name: mpv
      - name: yt-dlp
      - name: chafa
    install: |
      bin.install "unspool"
    test: |
      system "#{bin}/unspool", "--version"

release:
  github:
    owner: ali5ter
    name: unspool
